<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS list</title>
</head>
<style>
    nav ul li{
        /* list-style:lower-greek; */
        background-color: aqua;
        list-style-type: "😉";
        /* bullets = list marker content 
        = list item */
        list-style-position: inside;   /*  this make the list marker a part of list item so bg color can be applied to it */
        border: 2px solid black;
        /* list-style: disc inside url(https://static.vecteezy.com/system/resources/thumbnails/056/476/545/small/wonderful-minimalist-iridescent-3d-star-render-authentic-png.png); */
    }
</style>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Conatct</li>
        </ul>
    </nav>
</body>
</html>
