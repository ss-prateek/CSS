<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: gray;
            height: 100vh;
            width: 100vw;
        }
        .box{
            width: 34px;
            height: 45px;
            /* animation: animation1; */
            /* animation-duration: 1.5s; */
            /* kitney der me hoga pura animation */
            /* animation-iteration-count: infinite; */
            /* kitne bar hoga animation */
            /* animation-timing-function: ease-out; */
            /* animation ke speed curve ko define karta hai */
            /* animation-delay: 0.5s; */
            /* animation ke start me delay */
            /* animation-direction: alternate-reverse; */
                /* animation ke direction ko define karta hai */
            /* animation-play-state: paused; */
            /* jaha apply karenge vhi animation chalega/rukega */

            /* shorthand for animation */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: animation1 1.5s ease-in-out 1s 1 forwards, animation2 1.5s ease-in-out 3s 1;
            /* Use coma separate for multiple animations */
            /* fill-mode: forwards iss se box end me rahega after animation ends */
            /* fill-mode: backwards iss se box start me rahega before animation starts */
        }
        @keyframes animation1{
            from{
                background-color: red;
            }
            to{
                background-color: yellow;
                transform: translateX(1000px);
            }
        }
        @keyframes animation2 {
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(220deg);
            }
            80%{
                transform: rotate(300deg);
            }
            100%{
                transform: rotate(310deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>
</html>
