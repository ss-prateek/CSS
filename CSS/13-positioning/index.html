<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            background-color: antiquewhite;
            /* position: relative; To change positions as per our need */
            /* position: absolute; for inheriting parents position */
            /* if position is absolute it finds the nearest parent and uses its attributes */
            /* top: 8px;
            bottom: 60px;
            left: 55px;
            z-index: -1;    up if z index is greater */
            position: sticky;

        }
        .box2{
            background-color: aqua;
        }
        .box3{
            background-color: aquamarine;
            /* position: fixed;
            bottom: 0px;
            left: 12vw; */
        }
        .box4{
            background-color: blue;
        }
        .box{
            height: 120px;
            width: 75vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }
        .parent{
            /* Exception - tranfrom, filtered or perspective propperties can also make an element appear as positioned */
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="parent">
         <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
