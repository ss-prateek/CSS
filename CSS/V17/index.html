<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /*Element selector*/
        /* div{
            background-color: red;
        } */

/* Class selector */
    .red{
        background-color: red;
    }

/* Id selector */
    #green{
        background-color: green;
    }

/* Child selector - Applied to direct child of div */
    div > p{
        color: blue;
        background-color: brown;
    }

/* Descendent selector - Applied to p anywhere inside div even if not direct child of div */
    div p{
        color: blue;
        background-color: brown;
    }

/* Universal selector */
    *{
        margin: 0;
        padding: 0;
    }

/* Pseudo selector */
    a:visited{          /*Visited website link will have yellow colour */
        color: yellow;
    }

    a:link{             /*Unisited website link will have green colour */
        color: green;
    }

    a:active{           /*When we open a website from given button its background will get red while opening*/
        background-color: red;
    }

    a:hover{            /*When we will hover cursor above attribute, its background will get black */
        background-color: black;
    }

    p:first-child{
        background-color: aqua;
    }
    </style>


</head>
<body>
    <div class="one">
        <p>I'm First</p>
        <p>I'm Second</p>
    </div>
    <div class="red">
        I'm a Div
        <p>I'm a para inside div (direct child)</p>
        <article>
            <p>I'm a para inside div (not a direct child)</p>
        </article>
    </div>
    <div id="green">
        I'm another div
    </div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebook2.com">Go to Facebook</a>
    <a href="https://pw.live">Go to PW</a>
</body>
</html>
