<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours</title>
    <style>
        h1{
            /* color: red;     Colour keyword */
            /* color: #0BEE0B; Hex color code*/
            /* color: rgb(166, 30, 78);    rgb(red upto 255,green upto 255,blue upto 255) */
            /*color: rgba(166, 30, 78, 0.694);   rgba(red upto 255,green upto 255,blue upto 255,alpha) alpha is opacity 0 to 1*/
            color: hsl(11, 56%, 37%)  /* hsl(hue, saturation, lightness) */
            /* Same goes for background,border,etc color */
        } 
    </style>
</head>
<body>
    <h1>Let's learn about colours</h1>
    <p>
        Colours can be represented in :
        <ol>
            <li>Colour Keywords</li>
            <li>Hex colour code</li>
            <li>RGB</li>
            <li>RGBA</li>
            <li>HSL</li>
        </ol>
    </p>
</body>
</html>
