<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonce animation using CSS</title>
    <style>
        *{
            margin: 40px;
            padding: 40px;
            background-color: skyblue;
        }
        .box1{
            height: 80px;
            width: 80px;
            background-color: greenyellow;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: animateX 5s linear infinite, animateY 1s ease-out infinite alternate;
        }
        .box2{
            height: 80px;
            width: 80px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: animateX2 3s linear infinite, animateY2 1s ease-out infinite alternate;
        }

        @keyframes animateX {
            from{
                left: 0;
            }
            to{
                left: 100%
            }
        }

        @keyframes animateY {
            from{
                bottom: 0;
            }
            to{
                bottom: 100%;
            }
        }

        @keyframes animateX2 {
            from{
                left: 0;
            }
            to{
                left: 100%
            }
        }

        @keyframes animateY2 {
            from{
                bottom: 0;
            }
            to{
                bottom: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="conatiner1">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
