<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        
        header{
            position: sticky;
            top: 0;
        }

        nav{
            background-color: pink;
            height: 83px;
        }

        main{
            background-color: black;
            color: white;
            padding: 34px;
        }

        .container {
            background-color: green;
            margin: 12px 34px;
            padding: 55px 23px;
            text-align: center;
        }

        .box1 {
            background-color: palevioletred;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .box2 {
            background-color: blue;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .text-box{
            padding: 34px;
            border: 2px solid white;
            margin: 80px 23vw;
            font-size: 2em;
            border-radius: 22px;
        }

        .orangebox{
            height:48px;
            width: 48px;
            background-color: orange;
            border-radius: 33px;
            position: fixed;
            bottom:12px;
            right:23px;
        }

        footer{
            background-color:burlywood;
            height: 50px;
        }
    </style>
</head>
<body>
    <header>
        <nav>

        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text-box">
            <p>This is a demo page created for practice</p>
        </div>

        <div class="orangebox">

        </div>
    </main>

    <footer>

    </footer>
</body>
</html>
