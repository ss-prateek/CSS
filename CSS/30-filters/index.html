<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img1{
            /* filter: blur(4px); */
            /* filter: invert(); */
            /* negative image */
            filter: opacity(25%);
        }
        .img2{
            /* filter: grayscale(100%); */
            filter: sepia(88%);
        }
        .img3{
            filter: brightness(200%) contrast(3);
            /* multiple filters can be applid by using space */
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://imgs.search.brave.com/38pvX07NepkY5Vi9hREtMzblzYDTJdbbQcMxHwp6rjU/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wMDMv/MzM0Lzg5NC9zbWFs/bC9kZXNrdG9wLXNv/dXJjZS1jb2RlLWFu/ZC13YWxscGFwZXIt/YnktY29kaW5nLWFu/ZC1wcm9ncmFtbWlu/Zy1mcmVlLXBob3Rv/LmpwZw">
